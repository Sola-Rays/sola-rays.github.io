<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1D2A3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SolaRays">
<meta name="description" content="SolaRays business dashboard: clients, projects, calendar, suppliers and solar calculator.">
<title>SolaRays Dashboard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap">
<link rel="stylesheet" href="vendor/bootstrap.min.css?v=399b491526">
<link rel="stylesheet" href="css/app.css?v=1acd29491b">
<script defer src="js/app.js?v=67d7d03596"></script>
</head>
<body>
<div class="app" id="app">
  <aside class="rail">
    <button type="button" class="brand" data-view="home" aria-label="SolaRays dashboard home"><span class="bn"><span class="s">Sola</span>Rays</span><small>Business Dashboard</small></button>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="foot">
      <div class="sync" role="status" aria-live="polite"><span class="dot" id="dot"></span><span id="syncText">Starting…</span></div>
      <button class="btn btn-line btn-sm" id="refreshBtn" type="button" aria-label="Refresh data from Google Sheets" title="Refresh data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.5 4.5L20 16M20 20v-4h-4"/></svg><span>Refresh data</span></button>
      <button class="btn btn-line btn-sm" id="settingsBtn" type="button" aria-label="Database settings" title="Database"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg><span>Database</span></button>
    </div>
  </aside>
  <main id="main" class="view"><div class="loading"><span class="spin"></span>Opening your dashboard…</div></main>
  <nav class="tabbar" id="tabs" aria-label="Sections"></nav>
</div>
<div id="modalRoot"></div>
<noscript><p style="padding:20px">The SolaRays dashboard needs JavaScript turned on.</p></noscript>
</body>
</html>
