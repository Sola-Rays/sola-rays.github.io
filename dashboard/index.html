<script>
(()=>{
const DEFAULT_SHEET="1jQj_Or2LacAQaQfj39y7PnXWtNRmQzKSgijXe-3o2uA";
const ICONS={
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  clients:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c1.9.6 3.1 2.4 3.5 5.5"/>',
  projects:'<path d="M3 9h18l-2 11H5z"/><path d="M3 9l3-5h12l3 5M9 13h6"/>',
  calendar:'<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h2M14 14h2M8 17h2"/>',
  suppliers:'<rect x="3" y="7" width="13" height="11" rx="1"/><path d="M16 11h3l2 3v4h-5"/><circle cx="7" cy="19" r="1.8"/><circle cx="18" cy="19" r="1.8"/>',
  calc:'<rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M8 6.5h8v3H8zM8.5 13h.01M12 13h.01M15.5 13h.01M8.5 17h.01M12 17h.01M15.5 17h.01"/>'
};
const ico=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;
const VIEWS=[["home","Dashboard"],["clients","Clients"],["projects","Projects"],["calendar","Calendar"],["suppliers","Suppliers"],["calc","Calculator"]];

/* Each section maps to a tab of the Google Sheet. Field keys are the sheet's column headers, exactly as written there. */
const TABS={
 Clients:{sheet:"CRM Dashboard",key:"clients",title:"Client",idField:"S.N.",idMode:"serial",filterField:"Consulted (Y/N)",filterOpts:["Yes","No"],fields:[
  ["S.N.","No.","hidden"],["Client","Client name","text"],["Phone","Phone","text"],["Facebook","Facebook","text"],
  ["Address","Address","text"],["GPS Coodinates","GPS coordinates","text"],
  ["DU","Utility","text"],
  ["Type","Type","select",["Residence","Business","Under Construction - Business","Under Construction - Residence","Farm","Government"]],
  ["kWh","Monthly kWh","number"],["Amount","Monthly bill (₱)","number"],["Rate per kWh","Rate per kWh (₱)","number"],
  ["Consulted (Y/N)","Consulted","select",["Yes","No"]],["Consultation Date","Consultation date","date"],["Notes","Notes","textarea"],["Photos","Photos","photos"]]},
 Projects:{sheet:"Projects",key:"projects",title:"Project",idField:"ID",idMode:"prefix",prefix:"PR",filterField:"Status",fields:[
  ["ID","ID","hidden"],["Client No.","Client No.","hidden"],["Client","Client","clientpick"],["System (kWp)","System (kWp)","number"],["Panels","Panels","text"],
  ["Inverter","Inverter","text"],["Battery","Battery","text"],["Contract Price","Contract price (₱)","number"],["Contract Date","Contract date","date"],
  ["Payment","Payment","select",["Cash","GSIS loan"]],["Amount Received","Amount received (₱)","number"],
  ["Status","Status","select",["Downpayment","Ordering","Scheduled","Installing","Awaiting loan release","Completed"]],
  ["Start Date","Start date","date"],["Completion Date","Completion date","date"],["Notes","Notes","textarea"],["Photos","Photos","photos"]]},
 Suppliers:{sheet:"Suppliers",key:"suppliers",title:"Supplier item",idField:null,filterField:"Item",filterOpts:["PV Module","Inverter","Battery","Accessories"],fields:[
  ["Supplier","Supplier","text"],["Item","Category","select",["PV Module","Inverter","Battery","Accessories"]],
  ["Brand","Brand","text"],["Specs / Description","Specs / description","textarea"],["SRP","Price (₱)","number"],["Photos","Photos","photos"]]},
 Calendar:{sheet:"Calendar",key:"calendar",title:"Event",idField:"ID",idMode:"prefix",prefix:"EV",filterField:"Type",filterOpts:[],fields:[
  ["ID","ID","hidden"],["Title","Title","text"],["Type","Type","select",[]],["Status","Status","select",["Scheduled","Done","Cancelled"]],
  ["Date","Date","date"],["Start Time","Start time","time"],["End Time","End time","time"],
  ["Client No.","Client No.","hidden"],["Client","Client","clientpick"],["Project","Project","projpick"],
  ["Location","Location","text"],["Notes","Notes","textarea"],["Created","Created","hidden"]]}
};
Object.values(TABS).forEach(t=>{if(!t.filterOpts)t.filterOpts=t.fields.find(f=>f[0]===t.filterField)[3]});
queueMicrotask(()=>{TABS.Calendar.fields.find(f=>f[0]==="Type")[3]=EVENT_TYPES.map(x=>x[0])});

const state={view:"home",sheetId:null,data:{Clients:[],Projects:[],Suppliers:[],Calendar:[]},heads:{},loaded:false,
  filter:{clients:"All",projects:"All",suppliers:"All"},q:{clients:"",projects:"",suppliers:""},
  error:null,sheetIds:{},period:"12",cal:{month:"",sel:"",hidden:[]}};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(v===""||v==null)return 0;const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isNaN(n)?0:n};
const peso=v=>"₱"+Math.round(num(v)).toLocaleString("en-PH");
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
function toISO(s){
  s=String(s||"").trim();if(!s)return "";
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m=s.match(/^(\d{1,2})[-\s]([A-Za-z]{3})[A-Za-z]*[-\s,]+(\d{4})$/);if(m){const i=MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());if(i>=0)return `${m[3]}-${pad(i+1)}-${pad(m[1])}`}
  m=s.match(/^([A-Za-z]{3})[A-Za-z]*\s+(\d{1,2}),?\s+(\d{4})$/);if(m){const i=MON.findIndex(x=>x.toLowerCase()===m[1].toLowerCase());if(i>=0)return `${m[3]}-${pad(i+1)}-${pad(m[2])}`}
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return `${m[3]}-${pad(m[1])}-${pad(m[2])}`;
  return "";
}
const sheetDate=iso=>{if(!iso)return "";const [y,mo,d]=iso.split("-");return `${+d}-${MON[+mo-1]}-${y}`};
const fmtDate=s=>{const i=toISO(s);if(!i)return s||"";const [y,mo,d]=i.split("-");return `${MON[+mo-1]} ${+d}, ${y}`};
const qs=n=>`'${n.replace(/'/g,"''")}'`;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

function setSync(s,text){const d=$("#dot");d.className="dot "+(s==="ok"?"ok":s==="busy"?"busy":s==="err"?"err":"");$("#syncText").textContent=text}
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}

/* ---------- Google Sheets via the SolaRays Apps Script ---------- */
const cfg={api:lsGet("solarays.api")||"",key:lsGet("solarays.key")||""};
function errMsg(e){
  const c=e&&e.code;
  if(c==="offline")return "You're offline. Connect to Wi-Fi or mobile data, then tap Try again.";
  if(c==="network")return "Couldn't reach your Google Sheet. Check your internet connection and the Web app URL under Database.";
  if(c==="bad_key")return "The access key doesn't match the one in your Apps Script. Check it under Database.";
  if(c==="bad_response")return "The Web app URL didn't answer like the SolaRays script. Copy the Web app URL that ends in /exec, and check that access is set to Anyone.";
  if(c==="bad_row")return (e.message||"That row no longer exists.")+" Tap Try again to reload.";
  if(c==="setup")return "Add your Web app URL and access key under Database.";
  if(c==="bad_sheet")return "Your Apps Script is an older version that doesn't know the Calendar tab. Paste the new Code.gs and deploy a new version.";
  return (e&&e.message)||"Something went wrong talking to Google Sheets. Tap Try again.";
}
async function api(body){
  if(!cfg.api||!cfg.key)throw {code:"setup"};
  if(navigator.onLine===false)throw {code:"offline"};
  let res;
  try{res=await fetch(cfg.api,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,key:cfg.key}),redirect:"follow"})}
  catch(e){throw {code:navigator.onLine===false?"offline":"network"}}
  let j;try{j=await res.json()}catch(e){throw {code:"bad_response"}}
  if(!j||!j.ok)throw {code:(j&&j.error)||"bad_response",message:j&&j.message};
  return j;
}
async function loadAll(){
  if(!cfg.api||!cfg.key)return;
  setSync("busy","Syncing with Google Sheets…");state.error=null;
  try{
    const tabs={};Object.values(TABS).forEach(t=>tabs[t.sheet]=t.fields.map(f=>f[0]));
    const j=await api({action:"read",tabs});
    for(const [name,t] of Object.entries(TABS)){
      const vals=(j.tabs[t.sheet]&&j.tabs[t.sheet].values)||[];
      const head=(vals[0]&&vals[0].some(Boolean)?vals[0]:t.fields.map(f=>f[0])).map(h=>String(h).trim());
      state.heads[name]=head;
      state.data[name]=vals.slice(1).map((r,i)=>{const o={_row:i+2};head.forEach((h,k)=>o[h]=r[k]??"");return o})
        .filter(o=>head.some(h=>h!==t.idField&&String(o[h]).trim()!==""));
      if(name==="Suppliers")state.data[name]=state.data[name].filter(o=>o.Item||o.SRP);
    }
    state.loaded=true;
    setSync("ok","Synced "+new Date().toLocaleTimeString("en-PH",{hour:"numeric",minute:"2-digit"}));
  }catch(e){state.error=e;setSync("err","Sync failed")}
  render();
}
function cellValue(type,v){
  if(type==="date")return sheetDate(v);
  if(type==="number")return v===""?"":num(v);
  return v;
}
async function saveRecord(name,rec,isNew,orig){
  const t=TABS[name];const head=state.heads[name]||t.fields.map(f=>f[0]);
  const type=h=>(t.fields.find(f=>f[0]===h)||[,,"text"])[2];
  let row;
  if(isNew){row=head.map(h=>h in rec?cellValue(type(h),rec[h]):"")}
  else{row=head.map(h=>{
    if(!(h in rec))return null;
    const ty=type(h),a=rec[h],b=orig[h];
    const same=ty==="date"?toISO(a)===toISO(b):ty==="number"?(String(a).trim()===""?String(b).trim()==="":num(a)===num(b)&&String(b).trim()!==""):String(a)===String(b);
    return same?null:cellValue(ty,a);
  })}
  setSync("busy","Saving…");
  try{
    if(isNew)await api({action:"append",sheet:t.sheet,values:row});
    else if(row.some(v=>v!==null))await api({action:"update",sheet:t.sheet,row:rec._row,values:row});
    toast(isNew?t.title+" added":t.title+" saved");
    await loadAll();return true;
  }catch(e){state.error=e;setSync("err","Save failed");render();return false}
}
async function deleteRecord(name,rec){
  const t=TABS[name];setSync("busy","Deleting…");
  try{
    await api({action:"delete",sheet:t.sheet,row:rec._row});
    toast(t.title+" deleted");await loadAll();return true;
  }catch(e){state.error=e;setSync("err","Delete failed");render();return false}
}

/* ---------- status pills ---------- */
const PILL={Consulted:"good",Yes:"good",No:"",Scheduled:"info",Done:"",Quoted:"warn",Won:"good",Lost:"bad",
  Downpayment:"warn",Ordering:"info",Installing:"warn",Completed:"good","Awaiting loan release":"info"};
const pill=s=>s?`<span class="pill ${PILL[s]||""}">${esc(s)}</span>`:"";

/* ---------- render ---------- */
function renderNav(){
  const html=VIEWS.map(([k,l])=>`<button type="button" data-view="${k}" ${state.view===k?'aria-current="page"':""}>${ico(k)}<span>${l}</span></button>`).join("");
  $("#nav").innerHTML=html;$("#tabs").innerHTML=html;
}
function render(){
  renderNav();
  const m=$("#main");
  if(!cfg.api||!cfg.key)state.view="settings";
  if(state.view==="settings"){document.documentElement.classList.remove("lock");m.className="";m.innerHTML=settingsView();bindSettings();return}
  const banner=state.error?`<div class="banner"><span>${esc(errMsg(state.error))}</span><span class="row"><button class="btn ghost" type="button" data-act="refresh">Try again</button></span></div>`:"";
  const loading=!state.loaded&&!state.error?`<div class="empty" style="margin-bottom:16px">Loading your Google Sheet…</div>`:"";
  const v={home:homeView,clients:()=>listView("Clients"),projects:()=>listView("Projects"),suppliers:()=>listView("Suppliers"),calc:calcView,calendar:calendarView}[state.view];
  CHARTS={};chartSeq=0;
  const fixed=state.view==="home"||state.view==="calc"||state.view==="calendar";
  document.documentElement.classList.toggle("lock",fixed);
  m.className=state.view==="home"?"full":state.view==="calc"?"full calcfull":state.view==="calendar"?"full calfull":"";
  m.innerHTML=banner+loading+v();
  if(state.view==="calc")bindCalc();
  if(state.view==="home")requestAnimationFrame(drawCharts);
}
function header(title,sub,actions=""){
  return `<div class="top"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="row">${actions}</div></div>`;
}
function settingsView(){
  const sheet=`https://docs.google.com/spreadsheets/d/${DEFAULT_SHEET}/edit`;
  return `<div class="setup">
  <div class="mbrand" style="display:block"><span class="s">Sola</span>Rays</div>
  <h1>Database</h1>
  <p class="sub" style="font-size:15px;margin:8px 0 16px">Connect this device to your Google Sheet through the SolaRays Apps Script. Enter both once per device; they stay saved in this browser only.</p>
  <div class="form">
    <div class="f full"><label for="apiUrl">Web app URL</label><input id="apiUrl" value="${esc(cfg.api)}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div class="f full"><label for="apiKey">Access key</label><input id="apiKey" type="password" value="${esc(cfg.key)}" placeholder="The ACCESS_KEY from your script" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
  </div>
  <div id="setupErr" class="sub" style="color:var(--bad);margin-top:10px"></div>
  <div class="actions"><a class="btn ghost" href="${sheet}" target="_blank" rel="noopener" style="text-decoration:none">Open Google Sheet</a><button class="btn" id="connectBtn" type="button">Connect</button></div></div>`;
}
function bindSettings(){
  $("#connectBtn").onclick=async()=>{
    const url=$("#apiUrl").value.trim(),key=$("#apiKey").value.trim();
    if(!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url)){$("#setupErr").textContent="Paste the Web app URL from Apps Script. It starts with https://script.google.com/macros/s/ and ends with /exec.";return}
    if(!key){$("#setupErr").textContent="Enter the access key you set in the script.";return}
    const prev={...cfg};cfg.api=url;cfg.key=key;
    $("#connectBtn").disabled=true;$("#connectBtn").textContent="Connecting…";
    try{await api({action:"read",tabs:{}});lsSet("solarays.api",url);lsSet("solarays.key",key);state.view="home";toast("Connected to Google Sheets");await loadAll()}
    catch(e){Object.assign(cfg,prev);$("#setupErr").textContent=errMsg(e);$("#connectBtn").disabled=false;$("#connectBtn").textContent="Connect"}
  };
}

/* ---------- links between clients, projects and events ---------- */
const clientByNo=no=>no===""||no==null?null:state.data.Clients.find(c=>String(c["S.N."]).trim()===String(no).trim())||null;
const clientFor=r=>clientByNo(r["Client No."])||(r.Client?state.data.Clients.find(c=>String(c.Client).trim().toLowerCase()===String(r.Client).trim().toLowerCase()):null)||null;
const projectsFor=c=>state.data.Projects.filter(p=>clientFor(p)===c);
const projectById=id=>state.data.Projects.find(p=>String(p.ID)===String(id))||null;

/* ---------- calendar ---------- */
const EVENT_TYPES=[
  ["Installation","#FFB612"],["Site visit / Consultation","#6CB4FF"],["Client meeting","#4FD18B"],["Contract signing","#B9A6FF"],
  ["Payment collection","#FF7A59"],["Supplier pickup / Delivery","#3DD6C6"],["Follow-up call","#F59AD8"],["Maintenance / After-sales","#C9A66B"],["Other","#8FA1B7"]];
const typeColor=t=>(EVENT_TYPES.find(x=>x[0]===t)||EVENT_TYPES[EVENT_TYPES.length-1])[1];
function parseTime(s){
  s=String(s||"").trim();if(!s)return "";
  const m=s.match(/^(\d{1,2})(?::(\d{2}))?(?::\d{2})?\s*([AaPp][Mm])?$/);if(!m)return "";
  let h=+m[1];const mi=m[2]||"00",ap=(m[3]||"").toLowerCase();
  if(ap==="pm"&&h<12)h+=12;if(ap==="am"&&h===12)h=0;if(h>23)return "";
  return pad(h)+":"+mi;
}
const fmtTime=t=>{if(!t)return "";let [h,m]=t.split(":").map(Number);const ap=h>=12?"PM":"AM";h=h%12||12;return `${h}:${pad(m)} ${ap}`};
function allEvents(){
  const ev=[];
  state.data.Calendar.forEach(e=>{const iso=toISO(e.Date);if(!iso)return;const c=clientFor(e);
    ev.push({iso,start:parseTime(e["Start Time"]),end:parseTime(e["End Time"]),type:e.Type||"Other",title:e.Title||((e.Type||"Event")+(e.Client?": "+e.Client:"")),client:e.Client||"",clientRef:c,loc:e.Location||(c&&c.Address)||"",status:e.Status||"Scheduled",src:"Calendar",row:e._row})});
  const has=(iso,type,c)=>ev.some(x=>x.src==="Calendar"&&x.iso===iso&&x.type===type&&c&&x.clientRef===c);
  state.data.Projects.forEach(p=>{const iso=toISO(p["Start Date"]);if(!iso)return;const c=clientFor(p);if(has(iso,"Installation",c))return;
    ev.push({iso,start:"",end:"",type:"Installation",title:"Installation: "+(p.Client||"Project"),client:p.Client||"",clientRef:c,loc:(c&&c.Address)||"",status:p.Status==="Completed"?"Done":"Scheduled",src:"Projects",row:p._row,auto:true})});
  state.data.Clients.forEach(c=>{const iso=toISO(c["Consultation Date"]);if(!iso)return;if(has(iso,"Site visit / Consultation",c))return;
    ev.push({iso,start:"",end:"",type:"Site visit / Consultation",title:"Consultation: "+(c.Client||"Client"),client:c.Client||"",clientRef:c,loc:c.Address||"",status:c["Consulted (Y/N)"]==="Yes"?"Done":"Scheduled",src:"Clients",row:c._row,auto:true})});
  return ev.sort((a,b)=>a.iso.localeCompare(b.iso)||(a.start||"99").localeCompare(b.start||"99"));
}
function evButton(e,compact){
  const col=typeColor(e.type);
  if(compact)return `<button type="button" class="chipev ${e.status==="Cancelled"?"cx":""}" data-edit="${e.src}" data-row="${e.row}" style="--c:${col}" title="${esc(e.title)}">${e.start?`<b>${esc(fmtTime(e.start).replace(":00","").replace(" ",""))}</b> `:""}${esc(e.title)}</button>`;
  const when=e.start?fmtTime(e.start)+(e.end?" – "+fmtTime(e.end):""):"All day";
  return `<button type="button" class="evrow ${e.status==="Cancelled"?"cx":""}" data-edit="${e.src}" data-row="${e.row}" style="--c:${col}"><span class="evbar"></span><span class="evt">${esc(when)}</span><span class="evm"><b>${esc(e.title)}</b><span>${esc([e.type,e.loc?String(e.loc).split(",").slice(0,2).join(","):""].filter(Boolean).join(" · "))}</span></span>${e.status!=="Scheduled"?pill(e.status):e.auto?`<span class="pill">From ${e.src==="Projects"?"project":"client"}</span>`:""}</button>`;
}
function calendarView(){
  const cal=state.cal;const t=today();
  const [Y,M]=cal.month.split("-").map(Number);
  const first=new Date(Y,M-1,1),days=new Date(Y,M,0).getDate(),lead=first.getDay();
  const rows=Math.ceil((lead+days)/7);
  const all=allEvents().filter(e=>!cal.hidden.includes(e.type));
  const byDay={};all.forEach(e=>(byDay[e.iso]=byDay[e.iso]||[]).push(e));
  let cells="";
  for(let i=0;i<rows*7;i++){
    const d=new Date(Y,M-1,1-lead+i),iso=isoOf(d),out=d.getMonth()!==M-1,list=byDay[iso]||[];
    const shown=list.slice(0,3),more=list.length-shown.length;
    cells+=`<div class="day${out?" out":""}${iso===t?" today":""}${iso===cal.sel?" sel":""}" role="gridcell" tabindex="0" data-cal-day="${iso}" aria-label="${esc(fmtDate(iso))}, ${list.length} event${list.length===1?"":"s"}"><span class="dn">${d.getDate()}</span><div class="evs">${shown.map(e=>evButton(e,true)).join("")}${more>0?`<span class="more">+${more} more</span>`:""}</div><div class="dots">${list.slice(0,4).map(e=>`<i style="background:${typeColor(e.type)}"></i>`).join("")}</div></div>`;
  }
  const selList=byDay[cal.sel]||[];
  const upcoming=all.filter(e=>e.iso>cal.sel&&e.iso>=t&&e.status!=="Cancelled").slice(0,8);
  const monthName=first.toLocaleDateString("en-PH",{month:"long",year:"numeric"});

    <div class="row"><div class="mnav"><button type="button" class="btn ghost icon" data-cal-nav="-1" aria-label="Previous month">‹</button><b>${esc(monthName)}</b><button type="button" class="btn ghost icon" data-cal-nav="1" aria-label="Next month">›</button></div>

  <div class="tfilter">${EVENT_TYPES.map(([n,c],i)=>`<button type="button" class="chip tchip" data-cal-type="${esc(n)}" aria-pressed="${!cal.hidden.includes(n)}" style="--c:${c}"><i></i>${esc(n)}${counts[i]?` <span>${counts[i]}</span>`:""}</button>`).join("")}</div>
  <div class="calwrap">
    <section class="card month"><div class="wk">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<span>${d}</span>`).join("")}</div><div class="mgrid" role="grid" style="--rows:${rows}">${cells}</div></section>
    <section class="card agenda"><div class="ch"><h2>${esc(selName)}</h2><span>${selList.length} event${selList.length===1?"":"s"}</span></div>
      <div class="agscroll">
        <div class="evlist">${selList.length?selList.map(e=>evButton(e)).join(""):`<div class="empty">Nothing scheduled.</div>`}</div>
        <button type="button" class="btn ghost wide" data-new="Calendar" data-date="${cal.sel}">+ Add event on ${esc(fmtDate(cal.sel).replace(/, \d{4}$/,""))}</button>
        <h3 class="agh">Coming up</h3>
        <div class="evlist">${upcoming.length?upcoming.map(e=>`<div class="update">${esc(fmtDate(e.iso).replace(/, \d{4}$/,""))}</div>${evButton(e)}`).join(""):`<div class="empty">No upcoming events.</div>`}</div>
      </div></section>
  </div>`;
}

/* ---------- dashboard home: charts ---------- */
const COL={sol:"#FFB612",blue:"#6CB4FF",sky:"#8CC4FF",green:"#4FD18B",coral:"#FF7A59",lav:"#B9A6FF",slate:"#5E7590",grid:"#2B3D52",muted:"#8FA1B7"};
let CHARTS={},chartSeq=0;
const chartSlot=(fn,label)=>{const id="ch"+(++chartSeq);CHARTS[id]=fn;return `<div class="cbody chart" data-chart="${id}" role="img" aria-label="${esc(label)}"></div>`};
function drawCharts(){
  document.querySelectorAll("[data-chart]").forEach(el=>{
    const fn=CHARTS[el.dataset.chart];if(!fn)return;
    const w=Math.floor(el.clientWidth),h=Math.floor(el.clientHeight);if(w<40||h<40)return;
    el.innerHTML=fn(w,h);
  });
}
const shortPeso=v=>{v=Math.round(v);const a=Math.abs(v);return a>=1e6?"₱"+(v/1e6).toFixed(a>=1e7?1:2).replace(/\.?0+$/,"")+"M":a>=1e3?"₱"+Math.round(v/1e3)+"k":"₱"+v};
function niceMax(v){if(!(v>0))return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10])if(m*p>=v)return m*p;return 10*p}
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

function buckets(per,dates){
  const now=new Date();const keys=[],labels=[];let keyOf,start,prevStart;
  if(per==="30"){
    for(let i=29;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);keys.push(isoOf(d));labels.push(d.getDate()===1||i===29?MON[d.getMonth()]+" "+d.getDate():String(d.getDate()))}
    keyOf=iso=>iso;start=keys[0];prevStart=isoOf(new Date(now.getFullYear(),now.getMonth(),now.getDate()-59));
  }else if(per==="12"){
    for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);keys.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}`);labels.push(MON[d.getMonth()])}
    keyOf=iso=>iso.slice(0,7);start=keys[0]+"-01";const p=new Date(now.getFullYear(),now.getMonth()-23,1);prevStart=isoOf(p);
  }else{
    const valid=dates.filter(Boolean).sort();
    const first=valid.length?new Date(+valid[0].slice(0,4),+valid[0].slice(5,7)-1,1):new Date(now.getFullYear(),now.getMonth()-11,1);
    const months=(now.getFullYear()-first.getFullYear())*12+now.getMonth()-first.getMonth()+1;
    if(months>24){for(let y=first.getFullYear();y<=now.getFullYear();y++){keys.push(String(y));labels.push(String(y))}keyOf=iso=>iso.slice(0,4)}
    else{const n=Math.max(months,6);for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);keys.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}`);labels.push(MON[d.getMonth()]+(d.getMonth()===0?" "+String(d.getFullYear()).slice(2):""))}keyOf=iso=>iso.slice(0,7)}
    start="0000-00-00";prevStart=null;
  }
  return {keys,labels,keyOf,start,prevStart,end:today()};
}
function series(B,items,dateOf,valOf){
  const idx=new Map(B.keys.map((k,i)=>[k,i]));const out=B.keys.map(()=>0);
  items.forEach(it=>{const iso=dateOf(it);if(!iso||iso<B.start||iso>B.end)return;const i=idx.get(B.keyOf(iso));if(i!=null)out[i]+=valOf(it)});
  return out;
}
const cumulate=a=>{let s=0;return a.map(v=>s+=v)};

function spark(vals,color){
  if(vals.length<2)vals=[vals[0]||0,vals[0]||0];
  const w=100,h=30,mx=Math.max(...vals),mn=Math.min(...vals),rg=mx-mn||1;
  const pts=vals.map((v,i)=>[i*w/(vals.length-1),h-3-(v-mn)/rg*(h-7)]);
  const line=pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const [lx,ly]=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="M0,${h} L${line.replace(/ /g," L")} L${w},${h} Z" fill="${color}" fill-opacity=".16"></path><polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"></polyline><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.4" fill="${color}" vector-effect="non-scaling-stroke"></circle></svg>`;
}

/* Bars with an optional line. o: {labels,bars,line,barColor,lineColor,fmt,lineFmt,lineOwnScale,callout} */
function barLine(o){
  return (w,h)=>{
    const fs=11,L=o.lineOwnScale?30:48,R=o.lineOwnScale?40:12,T=26,Bm=22;
    const pw=Math.max(10,w-L-R),phh=Math.max(10,h-T-Bm),n=o.labels.length,step=pw/n;
    const bmax=niceMax(Math.max(...o.bars,...(o.line&&!o.lineOwnScale?o.line:[0])));
    const lmax=o.lineOwnScale?niceMax(Math.max(...o.line)):bmax;
    const y=(v,m)=>T+phh-(v/m)*phh;let s="";
    for(let i=0;i<=4;i++){const v=bmax*i/4,yy=y(v,bmax);s+=`<line x1="${L}" x2="${L+pw}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="${COL.grid}"></line><text x="${L-6}" y="${(yy+3.5).toFixed(1)}" text-anchor="end" font-size="${fs-1}" fill="${COL.muted}">${i?o.fmt(v):"0"}</text>`}
    const every=Math.max(1,Math.ceil(n/(pw/36)));
    o.bars.forEach((v,i)=>{const bw=Math.min(step*.62,46),x=L+i*step+(step-bw)/2,yy=y(v,bmax);
      if(v>0)s+=`<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${(T+phh-yy).toFixed(1)}" rx="${Math.min(4,bw/4).toFixed(1)}" fill="${o.barColor}" fill-opacity="${i===n-1?1:.82}"></rect>`;
      if(i%every===0||i===n-1)s+=`<text x="${(L+i*step+step/2).toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="${fs-1}" fill="${COL.muted}">${esc(o.labels[i])}</text>`});
    if(o.line){
      const pts=o.line.map((v,i)=>[L+i*step+step/2,y(v,lmax)]);
      if(o.lineOwnScale){[0,lmax/2,lmax].forEach(v=>{s+=`<text x="${L+pw+6}" y="${(y(v,lmax)+3.5).toFixed(1)}" font-size="${fs-1}" fill="${o.lineColor}">${o.fmt(v)}</text>`});
        s+=`<path d="M${pts[0][0].toFixed(1)},${T+phh} L${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L")} L${pts[pts.length-1][0].toFixed(1)},${T+phh} Z" fill="${o.lineColor}" fill-opacity=".10"></path>`}
      s+=`<polyline points="${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="none" stroke="${o.lineColor}" stroke-width="2.4" stroke-linejoin="round"></polyline>`;
      if(n<=31&&!o.lineOwnScale)s+=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#16212E" stroke="${o.lineColor}" stroke-width="2"></circle>`).join("");
      const [lx,ly]=pts[pts.length-1],lv=o.line[o.line.length-1];
      if(lv>0){const txt=(o.lineFmt||o.fmt)(lv),tw=txt.length*7+14,bx=Math.min(Math.max(lx-tw/2,L),L+pw-tw),by=Math.max(ly-28,2);
        s+=`<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="3.6" fill="${o.lineColor}"></circle><rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${tw}" height="20" rx="6" fill="${o.lineColor}"></rect><text x="${(bx+tw/2).toFixed(1)}" y="${(by+14).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="#16212E">${esc(txt)}</text>`}
    }
    const empty=!o.bars.some(v=>v>0)&&!(o.line||[]).some(v=>v>0);
    if(empty)s+=`<text x="${L+pw/2}" y="${T+phh/2}" text-anchor="middle" font-size="13" fill="${COL.muted}">${esc(o.emptyText||"No data for this period yet")}</text>`;
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" font-family="Inter, system-ui, sans-serif">${s}</svg>`;
  };
}
function donutHTML(parts,big,small){
  const tot=parts.reduce((a,p)=>a+p[1],0),r=56,c=2*Math.PI*r;let off=0,segs="";
  if(tot)parts.forEach(([n,v,col])=>{if(!v)return;const L=c*v/tot;segs+=`<circle cx="80" cy="80" r="${r}" fill="none" stroke="${col}" stroke-width="22" stroke-dasharray="${Math.max(L-(parts.filter(p=>p[1]).length>1?2.5:0),0).toFixed(2)} ${c.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 80 80)"></circle>`;off+=L});
  const leg=parts.map(([n,v,col])=>`<div class="lg"><i style="background:${col}"></i><span>${esc(n)}</span><b>${v}</b><em>${tot?Math.round(v/tot*100):0}%</em></div>`).join("");
  return `<div class="cbody donut"><svg viewBox="0 0 160 160" role="img" aria-label="${esc(small)}"><circle cx="80" cy="80" r="${r}" fill="none" stroke="#26374B" stroke-width="22"></circle>${segs}<text x="80" y="84" text-anchor="middle" font-size="28" font-weight="800" fill="#fff" font-family="Inter, sans-serif">${big}</text><text x="80" y="103" text-anchor="middle" font-size="11" fill="${COL.muted}" font-family="Inter, sans-serif">${esc(small)}</text></svg><div class="legend">${leg}</div></div>`;
}
const legendHTML=items=>`<div class="ckey">${items.map(([c,t])=>`<span><i style="background:${c}"></i>${esc(t)}</span>`).join("")}</div>`;
const townOf=c=>{const parts=String(c.Address||"").split(",").map(s=>s.trim()).filter(Boolean);if(!parts.length)return "";if(parts.length>=3)return parts[parts.length-2];if(parts.length===2)return /davao|oro|norte|sur|province/i.test(parts[1])?parts[0]:parts[1];return parts[0]};
const typeGroup=t=>{t=String(t||"");if(/under construction/i.test(t))return "Under construction";if(/^residen/i.test(t))return "Residence";if(/^business/i.test(t))return "Business";return t?"Other":"Not set"};

function homeView(){
  const {Clients,Projects}=state.data;const t=today();const per=state.period;
  const pDate=p=>toISO(p["Contract Date"])||toISO(p["Start Date"]);
  const cDate=p=>toISO(p["Completion Date"]);
  const vDate=c=>toISO(c["Consultation Date"]);
  const B=buckets(per,[...Projects.map(pDate),...Projects.map(cDate),...Clients.map(vDate)]);
  const inR=iso=>iso&&iso>=B.start&&iso<=t;
  const inPrev=iso=>B.prevStart&&iso&&iso>=B.prevStart&&iso<B.start;
  const perLabel={"30":"last 30 days","12":"last 12 months","all":"all time"}[per];

  const signed=series(B,Projects,pDate,p=>num(p["Contract Price"]));
  const collected=series(B,Projects,pDate,p=>num(p["Amount Received"]));
  const done=Projects.filter(p=>p.Status==="Completed");
  const kwpSeries=series(B,done,cDate,p=>num(p["System (kWp)"]));
  const kwpCum=cumulate(kwpSeries);
  const visits=series(B,Clients.filter(c=>c["Consulted (Y/N)"]==="Yes"),vDate,()=>1);
  const started=series(B,Projects,pDate,()=>1);

  const active=Projects.filter(p=>p.Status!=="Completed");
  const pipeline=active.reduce((s,p)=>s+num(p["Contract Price"]),0);
  const collect=active.reduce((s,p)=>s+Math.max(0,num(p["Contract Price"])-num(p["Amount Received"])),0);
  const projIn=Projects.filter(p=>inR(pDate(p)));
  const revenue=projIn.reduce((s,p)=>s+num(p["Contract Price"]),0);
  const prevRev=Projects.filter(p=>inPrev(pDate(p))).reduce((s,p)=>s+num(p["Contract Price"]),0);
  const recv=projIn.reduce((s,p)=>s+num(p["Amount Received"]),0);
  const rate=revenue?Math.round(recv/revenue*100):null;
  const doneIn=done.filter(p=>inR(cDate(p)));
  const kwpIn=doneIn.reduce((s,p)=>s+num(p["System (kWp)"]),0);
  const consulted=Clients.filter(c=>c["Consulted (Y/N)"]==="Yes");
  const consultedIn=consulted.filter(c=>inR(vDate(c))).length;
  const owed=cumulate(signed.map((v,i)=>v-collected[i]));
  const rateSeries=(()=>{const a=cumulate(signed),b=cumulate(collected);return a.map((v,i)=>v?b[i]/v*100:0)})();
  const revDelta=B.prevStart&&prevRev?Math.round((revenue-prevRev)/prevRev*100):null;

  const kpi=(l,v,h,hc,vals,col,vcls="")=>`<div class="kpi k"><div class="l">${l}</div><div class="v ${vcls}">${v}</div><div class="h" style="${hc?"color:"+hc:""}">${h}</div>${spark(vals,col)}</div>`;

  const types=["Residence","Business","Under construction","Other","Not set"].map((n,i)=>[n,Clients.filter(c=>typeGroup(c.Type)===n).length,[COL.sol,COL.blue,COL.lav,COL.green,COL.slate][i]]).filter(p=>p[1]||["Residence","Business","Under construction"].includes(p[0]));
  const pays=[["Cash",Projects.filter(p=>p.Payment==="Cash").length,COL.green],["GSIS loan",Projects.filter(p=>p.Payment==="GSIS loan").length,COL.coral]];
  const noPay=Projects.length-pays[0][1]-pays[1][1];if(noPay)pays.push(["Not set",noPay,COL.slate]);

  const fun=[["Clients",Clients.length,COL.blue],["Consulted",consulted.length,COL.sky],["Projects",Projects.length,COL.sol],["Completed",done.length,COL.green]];
  const funMax=Math.max(1,fun[0][1]);
  const funnel=`<div class="cbody funnel">${fun.map(([n,v,c],i)=>{const pct=i&&fun[i-1][1]?Math.round(v/fun[i-1][1]*100):null;return `<div class="fstep" style="width:${Math.max(34,v/funMax*100).toFixed(0)}%;background:${c}"><span>${n}</span><b>${v}${pct!=null?" · "+pct+"%":""}</b></div>`}).join("")}</div>`;

  const tcount={};Clients.forEach(c=>{const tw=townOf(c);if(tw)tcount[tw]=(tcount[tw]||0)+1});
  const towns=Object.entries(tcount).sort((a,b)=>b[1]-a[1]).slice(0,7);const tmax=Math.max(1,...towns.map(x=>x[1]));
  const townsHTML=towns.length?`<div class="cbody hbars">${towns.map(([n,v],i)=>`<div class="hb"><span>${esc(n)}</span><div><i style="width:${(v/tmax*100).toFixed(0)}%;background:${i?COL.blue:COL.sol}"></i></div><b>${v}</b></div>`).join("")}</div>`:`<div class="cbody"><div class="empty">Add addresses like "Poblacion, Monkayo, Davao de Oro" and towns show here.</div></div>`;

  const stages=[["Downpayment",COL.coral],["Ordering",COL.lav],["Scheduled",COL.blue],["Installing",COL.sol],["Awaiting loan release",COL.green]].map(([n,c])=>[n,active.filter(p=>p.Status===n).length,c]);
  const next=allEvents().find(e=>e.type==="Installation"&&e.iso>=t&&e.status==="Scheduled");
  const pipeHTML=`<div class="cbody pipe2"><div class="stackbar">${active.length?stages.filter(s=>s[1]).map(([n,v,c])=>`<i style="flex:${v};background:${c}" title="${n}: ${v}"></i>`).join(""):'<i style="flex:1;background:#26374B"></i>'}</div>
    <div class="slist">${stages.map(([n,v,c])=>`<div class="lg"><i style="background:${c}"></i><span>${n==="Awaiting loan release"?"Loan release":n}</span><b>${v}</b></div>`).join("")}</div>
    <button type="button" class="nextbox" ${next?`data-edit="${next.src}" data-row="${next.row}"`:'data-view="calendar"'}><span>Next install</span><b>${next?esc(next.client||next.title)+" · "+fmtDate(next.iso).replace(/, \d{4}$/,""):"None scheduled"}</b></button></div>`;

  const hr=new Date().getHours();const greet=hr<12?"Good morning":hr<18?"Good afternoon":"Good evening";
  const date=new Date().toLocaleDateString("en-PH",{weekday:"short",month:"short",day:"numeric"});
  const seg=[["30","30 days"],["12","12 months"],["all","All time"]].map(([k,l])=>`<button type="button" data-period="${k}" aria-pressed="${per===k}">${l}</button>`).join("");

  return `<div class="dhead"><div class="dh-l"><div class="mbrand"><span class="s">Sola</span>Rays</div><h1>${greet}, Raymund</h1><span class="sub">${date}</span></div>
    <div class="row"><div class="period" role="group" aria-label="Period">${seg}</div><button class="btn ghost" type="button" data-new="Projects">+ Project</button><button class="btn" type="button" data-new="Clients">+ Client</button></div></div>
  <div class="dash">
    ${kpi("Clients",Clients.length,`${consultedIn} consulted, ${perLabel}`,COL.green,cumulate(visits),COL.blue)}
    ${kpi("Active projects",active.length,`${shortPeso(pipeline)} contract value`,"",started,COL.sol)}
    ${kpi("To collect",peso(collect),"Balance on active jobs","",owed,COL.sol,"y")}
    ${kpi(per==="all"?"Revenue, all time":per==="30"?"Revenue, 30 days":"Revenue, 12 mo",shortPeso(revenue),revDelta==null?"Contract value signed":(revDelta>=0?"+":"")+revDelta+"% vs prior period",revDelta==null?"":revDelta>=0?COL.green:COL.coral,signed,COL.green)}
    ${kpi("kWp installed",(Math.round(kwpIn*10)/10).toLocaleString("en-PH"),`${doneIn.length} system${doneIn.length===1?"":"s"} completed`,"",kwpCum,COL.lav)}
    ${kpi("Collection rate",rate==null?"–":rate+"%","Collected vs contract",rate!=null&&rate>=80?COL.green:"",rateSeries,COL.coral)}
    <section class="card c-rev"><div class="ch"><h2>Contracts vs collections</h2><span>${perLabel[0].toUpperCase()+perLabel.slice(1)} · ₱</span></div>
      ${legendHTML([[COL.sol,"Contracts signed"],[COL.blue,"Collected"]])}
      ${chartSlot(barLine({labels:B.labels,bars:signed,line:collected,barColor:COL.sol,lineColor:COL.blue,fmt:shortPeso,emptyText:"Add projects with a contract date to see this chart"}),"Contracts signed and amounts collected, "+perLabel)}</section>
    <section class="card c-type"><div class="ch"><h2>Clients by type</h2><span>CRM tab</span></div>${donutHTML(types,Clients.length,"clients")}</section>
    <section class="card c-pay"><div class="ch"><h2>Payment mix</h2><span>All projects</span></div>${donutHTML(pays,Projects.length,"projects")}</section>
    <section class="card c-fun"><div class="ch"><h2>Client funnel</h2><span>Conversion</span></div>${funnel}</section>
    <section class="card c-kwp"><div class="ch"><h2>kWp installed</h2><span>Completed systems</span></div>
      ${legendHTML([[COL.lav,"kWp per period"],[COL.sol,"Running total"]])}
      ${chartSlot(barLine({labels:B.labels,bars:kwpSeries,line:kwpCum,barColor:COL.lav,lineColor:COL.sol,fmt:v=>String(Math.round(v*10)/10),lineFmt:v=>(Math.round(v*10)/10)+" kWp",lineOwnScale:true,emptyText:"Completed projects show here"}),"kWp installed per period with running total")}</section>
    <section class="card c-town"><div class="ch"><h2>Top towns</h2><span>Clients</span></div>${townsHTML}</section>
    <section class="card c-pipe"><div class="ch"><h2>Installation pipeline</h2><span>${active.length} active</span></div>${pipeHTML}</section>
  </div>`;
}

function itemHTML(name,r){

/* ---------- photos (saved to Google Drive by the Apps Script) ---------- */
const photoCache={};
const photoIds=v=>String(v||"").split(/[\s,;]+/).filter(x=>/^[A-Za-z0-9_-]{10,}$/.test(x));
const CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
function photoURL(id){
  if(photoCache[id])return photoCache[id];
  const p=api({action:"photo",id}).then(j=>{
    const bin=atob(j.data);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([arr],{type:j.mime||"image/jpeg"}));
  });
  photoCache[id]=p;p.catch(()=>{delete photoCache[id]});return p;
}
async function shrinkPhoto(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej({code:"bad_image",message:"That file couldn't be opened as a photo."});i.src=url});
    const max=1600,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.max(1,Math.round(img.naturalWidth*s)),h=Math.max(1,Math.round(img.naturalHeight*s));
    const c=document.createElement("canvas");c.width=w;c.height=h;
    const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
    const d=c.toDataURL("image/jpeg",0.82);
    return {data:d.slice(d.indexOf(",")+1),mime:"image/jpeg",name:String(file.name||"photo").replace(/\.[^.]+$/,"").slice(0,60)+".jpg"};
  }finally{URL.revokeObjectURL(url)}
}
function openViewer(id){
  const v=document.createElement("div");v.className="viewer";v.setAttribute("role","dialog");v.setAttribute("aria-label","Photo");

  document.body.appendChild(v);
  v.addEventListener("click",e=>{if(e.target===v||e.target.closest("[data-vclose]"))v.remove()});

}

/* ---------- calculator ---------- */
const calcIn={mode:"bill",bill:6000,kwh:500,rate:12,psh:4.5,loss:20,night:50,mult:2,bos:15,panelW:620};
const specOf=s=>String(s["Specs / Description"]||"")+" "+String(s.Brand||"");
const kwOf=s=>{const m=specOf(s).match(/(\d+(?:\.\d+)?)\s*kW(?!h)/i);return m?parseFloat(m[1]):0};
const kwhOf=s=>{const m=specOf(s).match(/(\d+(?:\.\d+)?)\s*kWh/i);return m?parseFloat(m[1]):0};
const wOf=s=>{const m=specOf(s).match(/(\d{3})\s*W\b/i);return m?parseInt(m[1]):0};
const itemName=s=>[s.Brand&&s.Brand!=="-"?s.Brand:"",String(s["Specs / Description"]).split(",").slice(0,2).join(",")].filter(Boolean).join(" ");
function cheapest(cat,test){
  return state.data.Suppliers.filter(s=>s.Item===cat&&num(s.SRP)>0&&(!test||test(s))).sort((a,b)=>num(a.SRP)-num(b.SRP))[0]||null;
}
function computeCalc(){
  const c=calcIn;
  const monthlyKWh=c.mode==="bill"?num(c.bill)/Math.max(0.01,num(c.rate)):num(c.kwh);
  const daily=monthlyKWh/30;
  const pr=1-num(c.loss)/100;
  const kwp=daily/((num(c.psh)*pr)||1);
  const panelW=num(c.panelW)||620;
  const panels=Math.max(1,Math.ceil(kwp*1000/panelW));
  const actualKwp=panels*panelW/1000;
  const invSizes=[3,5,6,8,10,12,16,20];
  const invKW=invSizes.find(s=>s>=actualKwp*0.9)||Math.ceil(actualKwp);
  const battNeed=daily*num(c.night)/100/0.9;
  const battKWh=battNeed>0?Math.ceil(battNeed/5.12)*5.12:0;
  const prodMonthly=actualKwp*num(c.psh)*pr*30;
  const savings=Math.min(prodMonthly,monthlyKWh)*num(c.rate);
  const pv=cheapest("PV Module",s=>wOf(s)&&Math.abs(wOf(s)-panelW)<=10)||cheapest("PV Module");
  const inv=cheapest("Inverter",s=>kwOf(s)>=invKW)||cheapest("Inverter");
  const bats=state.data.Suppliers.filter(s=>s.Item==="Battery"&&num(s.SRP)>0&&kwhOf(s)>=5);
  const perKWh=bats.length?Math.min(...bats.map(s=>num(s.SRP)/kwhOf(s))):0;
  const pvCost=pv?num(pv.SRP)*panels:0,invCost=inv?num(inv.SRP):0,batCost=perKWh*battKWh;
  const major=pvCost+invCost+batCost,bosCost=major*num(c.bos)/100,material=major+bosCost,sell=material*num(c.mult);
  const payback=savings>0?sell/(savings*12):0;
  return {monthlyKWh,daily,panels,panelW,actualKwp,invKW,battKWh,prodMonthly,savings,pv,inv,perKWh,pvCost,invCost,batCost,bosCost,material,sell,payback,hasPrices:!!(pv||inv||perKWh)};
}
function calcResultHTML(){
  const r=computeCalc();
  return `<div class="big">
    <div><div class="l">System</div><div class="v">${r.actualKwp.toFixed(2)}<span>kWp</span></div></div>
    <div><div class="l">Panels</div><div class="v">${r.panels}<span>× ${r.panelW}W</span></div></div>
    <div><div class="l">Battery</div><div class="v">${r.battKWh.toFixed(2)}<span>kWh</span></div></div>
  </div>
  <div class="kv">
    <div><span>Monthly consumption</span><span>${Math.round(r.monthlyKWh)} kWh (${r.daily.toFixed(1)} kWh/day)</span></div>
    <div><span>Hybrid inverter</span><span>${r.invKW} kW${r.inv?" · "+esc(itemName(r.inv)):""}</span></div>
    <div><span>Expected solar output</span><span>${Math.round(r.prodMonthly)} kWh/month</span></div>
    <div><span>Estimated savings</span><span>${peso(r.savings)}/month</span></div>
  </div>
  <h2 style="margin:18px 0 6px">Costing</h2>
  ${r.hasPrices?`<div class="kv">
    <div><span>Panels${r.pv?" ("+esc(r.pv.Supplier)+", "+peso(r.pv.SRP)+" each)":""}</span><span>${peso(r.pvCost)}</span></div>
    <div><span>Inverter${r.inv?" ("+esc(r.inv.Supplier)+")":""}</span><span>${peso(r.invCost)}</span></div>
    <div><span>Battery (${r.perKWh?peso(r.perKWh)+"/kWh":"no price"})</span><span>${peso(r.batCost)}</span></div>
    <div><span>Mounting, cables, protection (${esc(calcIn.bos)}%)</span><span>${peso(r.bosCost)}</span></div>
    <div><span>Material cost</span><span>${peso(r.material)}</span></div>
    <div class="tot"><span>Suggested selling price</span><span>${peso(r.sell)}</span></div>
    <div><span>Simple payback</span><span>${r.payback?r.payback.toFixed(1)+" years":"–"}</span></div>
  </div>`:'<div class="empty">Costing fills in from your Suppliers tab once it has loaded.</div>'}
  <p class="note">Internal estimate for planning a quotation, using the cheapest matching item in each category. The final quotation depends on the site visit, roof and actual stock.</p>
  <div class="actions"><span></span><button class="btn" type="button" id="toConsult">Save as new client</button></div>`;
}
function calcView(){
  const c=calcIn;
  const pvOpts=[...new Set([620,640,...state.data.Suppliers.filter(s=>s.Item==="PV Module").map(wOf).filter(Boolean)])].sort((a,b)=>a-b);
  return header("Solar Calculator","Size a hybrid system from the client's bill")+
  `<div class="calc"><div class="panel"><div class="form" id="calcForm">
    <div class="f full"><label>Based on</label><div class="seg"><button type="button" data-mode="bill" aria-pressed="${c.mode==="bill"}">Monthly bill (₱)</button><button type="button" data-mode="kwh" aria-pressed="${c.mode==="kwh"}">Monthly kWh</button></div></div>
    <div class="f" ${c.mode==="bill"?"":"hidden"}><label for="c-bill">Monthly bill (₱)</label><input id="c-bill" data-c="bill" inputmode="decimal" value="${esc(c.bill)}"></div>
    <div class="f" ${c.mode==="kwh"?"":"hidden"}><label for="c-kwh">Monthly kWh</label><input id="c-kwh" data-c="kwh" inputmode="decimal" value="${esc(c.kwh)}"></div>
    <div class="f"><label for="c-rate">Rate (₱/kWh)</label><input id="c-rate" data-c="rate" inputmode="decimal" value="${esc(c.rate)}"><span class="hint">From the client's latest bill</span></div>
    <div class="f"><label for="c-psh">Peak sun hours</label><input id="c-psh" data-c="psh" inputmode="decimal" value="${esc(c.psh)}"></div>
    <div class="f"><label for="c-loss">System losses (%)</label><input id="c-loss" data-c="loss" inputmode="decimal" value="${esc(c.loss)}"></div>
    <div class="f"><label for="c-night">Night use on battery (%)</label><input id="c-night" data-c="night" inputmode="decimal" value="${esc(c.night)}"><span class="hint">Share of daily kWh used after sunset</span></div>
    <div class="f"><label for="c-panelW">Panel size (W)</label><select id="c-panelW" data-c="panelW">${pvOpts.map(w=>`<option ${w==c.panelW?"selected":""}>${w}</option>`).join("")}</select></div>
    <div class="f"><label for="c-bos">Balance of system (%)</label><input id="c-bos" data-c="bos" inputmode="decimal" value="${esc(c.bos)}"><span class="hint">Mounting, cables, breakers</span></div>
    <div class="f"><label for="c-mult">Selling price multiplier</label><input id="c-mult" data-c="mult" inputmode="decimal" value="${esc(c.mult)}"><span class="hint">Material cost × this</span></div>
  </div></div>
  <div class="panel result" id="calcOut">${calcResultHTML()}</div></div>`;
}
function bindCalc(){
  const upd=()=>{$("#calcOut").innerHTML=calcResultHTML();bindToConsult()};
  document.querySelectorAll("[data-c]").forEach(el=>el.addEventListener("input",()=>{calcIn[el.dataset.c]=el.tagName==="SELECT"?num(el.value):el.value;lsSet("solarays.calc",JSON.stringify(calcIn));upd()}));
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{calcIn.mode=b.dataset.mode;render()});
  bindToConsult();
}
function bindToConsult(){
  const b=$("#toConsult");if(!b)return;
  b.onclick=()=>{const r=computeCalc();const bill=calcIn.mode==="bill"?num(calcIn.bill):Math.round(r.monthlyKWh*num(calcIn.rate));openForm("Clients",null,{"kWh":Math.round(r.monthlyKWh),"Amount":bill,"Rate per kWh":num(calcIn.rate),"Consulted (Y/N)":"Yes","Consultation Date":today(),
    Notes:`Calculator: ${r.actualKwp.toFixed(2)} kWp (${r.panels} x ${r.panelW}W), ${r.invKW}kW hybrid inverter, ${r.battKWh.toFixed(2)}kWh battery. Suggested price ${peso(r.sell)}.`})};
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const v=e.target.closest("[data-view]");if(v){state.view=v.dataset.view;lsSet("solarays.view",state.view);render();window.scrollTo(0,0);return}
  const n=e.target.closest("[data-new]");if(n){openForm(n.dataset.new,null,n.dataset.date?{Date:n.dataset.date}:undefined);return}
  const ed=e.target.closest("[data-edit]");if(ed){const rec=state.data[ed.dataset.edit].find(r=>r._row==ed.dataset.row);if(rec)openForm(ed.dataset.edit,rec);return}
  const f=e.target.closest("[data-filter]");if(f){state.filter[f.dataset.filter]=f.dataset.val;render();return}
  const cn=e.target.closest("[data-cal-nav]");if(cn){const d=+cn.dataset.calNav;if(!d){state.cal.sel=today();state.cal.month=today().slice(0,7)}else{const [y,m]=state.cal.month.split("-").map(Number);const nd=new Date(y,m-1+d,1);state.cal.month=`${nd.getFullYear()}-${pad(nd.getMonth()+1)}`;state.cal.sel=state.cal.month+"-01"}render();return}
  const ct=e.target.closest("[data-cal-type]");if(ct){const ty=ct.dataset.calType,h=state.cal.hidden;state.cal.hidden=h.includes(ty)?h.filter(x=>x!==ty):[...h,ty];lsSet("solarays.calHidden",JSON.stringify(state.cal.hidden));render();return}
  const cd=e.target.closest("[data-cal-day]");if(cd){state.cal.sel=cd.dataset.calDay;if(cd.dataset.calDay.slice(0,7)!==state.cal.month)state.cal.month=cd.dataset.calDay.slice(0,7);render();return}
  const pr=e.target.closest("[data-period]");if(pr){state.period=pr.dataset.period;lsSet("solarays.period",state.period);render();return}
  const a=e.target.closest("[data-act]");
  if(a&&a.dataset.act==="refresh"){state.sheetIds={};loadAll();return}
});
document.addEventListener("input",e=>{
  const s=e.target.closest("[data-search]");if(!s)return;
  const k=s.dataset.search;state.q[k]=s.value;const pos=s.selectionStart;render();const el=document.getElementById("q-"+k);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(x){}}
});
document.addEventListener("keydown",e=>{const day=e.target.closest&&e.target.closest("[data-cal-day]");if(day&&(e.key==="Enter"||e.key===" ")){e.preventDefault();day.click();return}if(e.key!=="Escape")return;const v=document.querySelector(".viewer");if(v){v.remove();return}if(closeModal)closeModal();else $("#modalRoot").innerHTML=""});
/* Dashboard and Calculator are fixed screens on iPad landscape and laptops: block pinch and trackpad zoom there. */
const lockedNow=()=>document.documentElement.classList.contains("lock")&&matchMedia("(min-width:1024px) and (min-height:600px)").matches;
["gesturestart","gesturechange"].forEach(t=>document.addEventListener(t,e=>{if(lockedNow()&&!e.target.closest(".sheet,.viewer"))e.preventDefault()},{passive:false}));
document.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1&&lockedNow())e.preventDefault()},{passive:false});
window.addEventListener("wheel",e=>{if(e.ctrlKey&&lockedNow())e.preventDefault()},{passive:false});
let resizeT;window.addEventListener("resize",()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{if(state.view==="home")drawCharts()},150)});
$("#refreshBtn").onclick=()=>{state.sheetIds={};loadAll()};
$("#settingsBtn").onclick=()=>{state.view="settings";render()};

/* ---------- boot ---------- */
try{const s=JSON.parse(lsGet("solarays.calc")||"null");if(s)Object.assign(calcIn,s)}catch(e){}
{const p=lsGet("solarays.period");if(["30","12","all"].includes(p))state.period=p}
state.cal.sel=today();state.cal.month=today().slice(0,7);try{const h=JSON.parse(lsGet("solarays.calHidden")||"[]");if(Array.isArray(h))state.cal.hidden=h}catch(e){}
const sv=lsGet("solarays.view");if(sv&&VIEWS.some(x=>x[0]===sv))state.view=sv;
if(location.hash&&VIEWS.some(x=>x[0]===location.hash.slice(1)))state.view=location.hash.slice(1);
render();
if(cfg.api&&cfg.key)loadAll();
window.addEventListener("online",()=>{if(cfg.api&&cfg.key&&state.error)loadAll()});
})();
</script>
</body>
</html>
